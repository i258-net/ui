name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 11.12.0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      # Before `pnpm test`: workshop's test script runs `playwright install chromium`.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm test

      - run: pnpm workshop:build

      # `vrt` does not install browsers; `pnpm test` may have already, but
      # --with-deps covers ubuntu system libraries on a cold cache.
      - name: Install Playwright Chromium
        run: pnpm --filter @i258/workshop exec playwright install --with-deps chromium

      - name: Visual regression (Storybook screenshots)
        run: pnpm --filter @i258/workshop vrt

      - name: Upload VRT failure output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vrt-results
          path: apps/workshop/test-results/
          if-no-files-found: ignore
