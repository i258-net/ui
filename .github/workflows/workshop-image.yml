name: workshop-image

# Builds and publishes the Storybook static image for apps/workshop.
# Cluster nodes are linux/amd64; build here rather than on an arm64 Mac.
#
# Image: ghcr.io/i258-net/ui-workshop (distinct from the npm package / repo name).
# GITHUB_TOKEN covers the GHCR push. No ci-i258 / CI_APP_* bump against k8s —
# those org secrets are deliberately not wired into this repo (see release.yml);
# Forge pins the digest in i258-net/k8s once the package exists.

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - docker/workshop-nginx.conf
      - .github/workflows/workshop-image.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - packages/ui/**
      - apps/workshop/**
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/workshop-nginx.conf
      - .github/workflows/workshop-image.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - packages/ui/**
      - apps/workshop/**
  workflow_dispatch:

env:
  IMAGE: ghcr.io/i258-net/ui-workshop

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report the digest
        if: github.event_name != 'pull_request'
        run: |
          PINNED="${IMAGE}@${{ steps.build.outputs.digest }}"
          echo "::notice title=ui-workshop image::${PINNED}"
          {
            echo "## ui-workshop image"
            echo
            echo '```'
            echo "${PINNED}"
            echo '```'
            echo
            echo "Tags: \`${IMAGE}:main\` and \`${IMAGE}:sha-${{ github.sha }}\`."
            echo "Pin this digest in i258-net/k8s (Forge) — this workflow does not open the bump PR."
          } >> "$GITHUB_STEP_SUMMARY"
