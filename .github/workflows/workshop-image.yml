name: workshop-image

# Builds and publishes the Storybook static image for apps/workshop.
# Cluster nodes are linux/amd64; build here rather than on an arm64 Mac.
#
# Image: ghcr.io/i258-net/ui-workshop (distinct from the npm package / repo name).
# GITHUB_TOKEN covers the GHCR push. On main, ci-i258 opens a digest-only PR on
# i258-net/k8s (same pattern as honeycomb build.yml; I25-155).

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - docker/workshop-nginx.conf
      - .github/workflows/workshop-image.yml
      - .github/scripts/pin-storybook-digest.py
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - packages/ui/**
      - apps/workshop/**
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/workshop-nginx.conf
      - .github/workflows/workshop-image.yml
      - .github/scripts/pin-storybook-digest.py
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - packages/ui/**
      - apps/workshop/**
  workflow_dispatch:

env:
  IMAGE: ghcr.io/i258-net/ui-workshop

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report the digest
        if: github.event_name != 'pull_request'
        run: |
          PINNED="${IMAGE}@${{ steps.build.outputs.digest }}"
          echo "::notice title=ui-workshop image::${PINNED}"
          {
            echo "## ui-workshop image"
            echo
            echo '```'
            echo "${PINNED}"
            echo '```'
            echo
            echo "Tags: \`${IMAGE}:main\` and \`${IMAGE}:sha-${{ github.sha }}\`."
            echo "A follow-up job opens a PR on i258-net/k8s to pin this digest."
          } >> "$GITHUB_STEP_SUMMARY"

  bump-k8s:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require ci-i258 App credentials
        env:
          APP_ID: ${{ secrets.CI_APP_ID }}
          APP_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error::Org secrets CI_APP_ID / CI_APP_PRIVATE_KEY are not visible to this repo. Image was still pushed to GHCR; pin the digest by hand until they are."
            exit 1
          fi

      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: i258-net
          repositories: k8s

      - uses: actions/checkout@v4
        with:
          path: ui

      - uses: actions/checkout@v4
        with:
          repository: i258-net/k8s
          token: ${{ steps.app-token.outputs.token }}
          path: k8s

      - name: Pin digest in k8s manifests
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          K8S_ROOT: k8s
        run: python3 ui/.github/scripts/pin-storybook-digest.py

      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: k8s
          branch: storybook/image-digest
          delete-branch: true
          title: "chore(storybook): pin image ${{ needs.build.outputs.digest }}"
          commit-message: "chore(storybook): pin image ${{ needs.build.outputs.digest }}"
          body: |
            Auto-opened by `i258-net/ui` after GHCR publish.

            Pins `ghcr.io/i258-net/ui-workshop@${{ needs.build.outputs.digest }}` in
            `clusters/home/apps/storybook/manifests/10-deployment.yaml` and
            `clusters/home/apps/storybook/versions.env`.

            Source commit: https://github.com/i258-net/ui/commit/${{ github.sha }}
            Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Digest-only bump — Forge merges under the standing Tier-2 ci-i258
            exception after diff + registry check (I25-155).
